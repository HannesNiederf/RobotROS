# ros_gz_bridge topics for the simulation (softwarespezifikation.md section 14).
# Gazebo names live under /sim/ so that only this bridge connects them to the ROS names the real robot uses.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /scan
  gz_topic_name: /sim/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /odom
  gz_topic_name: /sim/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /tf
  gz_topic_name: /sim/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
# True pose of the robot in the world (cliff areas and dock of sim_hw_adapter), not for navigation.
- ros_topic_name: /sim/ground_truth
  gz_topic_name: /sim/ground_truth
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /joint_states
  gz_topic_name: /sim/joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
# /cmd_vel goes to sim_hw_adapter (simulated Nano); only what it lets through reaches Gazebo.
- ros_topic_name: /sim/cmd_vel
  gz_topic_name: /sim/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
