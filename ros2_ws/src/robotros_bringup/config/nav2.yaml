# Nav2 in mode NORMAL (softwarespezifikation.md section 7.2, ÄM-01). Values from the spec are marked "spec";
# everything else is a Nav2 Jazzy default or "chosen here". The footprint, the map file and the behavior tree
# path are set by robotros_bringup/launch/navigation.launch.py (footprint from robot.yaml).
# Not yet here (later steps): contact_layer (/contact_map from contact_obstacles), keepout_filter,
# footprint_switcher (/footprint), speed profile switching.

amcl:
  ros__parameters:
    scan_topic: scan_filtered            # spec
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    robot_model_type: nav2_amcl::DifferentialMotionModel   # spec "diff-corrected"; ROS 2 name of the diff model
    laser_model_type: likelihood_field   # spec
    max_particles: 2000                  # spec
    min_particles: 500                   # spec
    update_min_d: 0.05                   # spec
    update_min_a: 0.10                   # spec
    alpha1: 0.2                          # spec (start values, slip without IMU)
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    set_initial_pose: false              # spec
    laser_max_range: 8.0                 # = scan_masker range_max
    laser_min_range: 0.15
    max_beams: 60                        # Nav2 default; 180 with sigma_hit 0.1 worsened M1-03 at goal B (ADR 0003)
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    laser_likelihood_max_dist: 2.0
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 1.0
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    do_beamskip: false

map_server:
  ros__parameters:
    yaml_filename: ""                    # set by the launch file

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1      # chosen here (slow robot)
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.04            # spec
      yaw_goal_tolerance: 0.08           # spec
      stateful: true                     # spec
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15           # spec: from the profile (NORMAL)
      lookahead_dist: 0.40               # spec
      min_lookahead_dist: 0.20           # spec
      max_lookahead_dist: 0.60           # spec
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.6 # spec
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true   # ADR 0003: the spec's min/max lookahead only act when scaled;
                                                 # short lookahead at low (cost-regulated) speed in narrow passages
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true      # spec
      max_allowed_time_to_collision_up_to_carrot: 1.0   # spec
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true  # spec "Kostenregelung an"
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05          # spec
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: true        # spec
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false             # spec, D-29
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3                           # spec: rolling 3 x 3 m
      height: 3
      resolution: 0.05                   # spec
      footprint: "[[0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"   # replaced by the launch file
      footprint_padding: 0.0             # ADR 0003 (Nav2 default 0.01): 0.45 m passage leaves 7.5 cm per side
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered          # spec
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: false            # ÄM-01 D-31
          obstacle_max_range: 4.0        # spec
          raytrace_max_range: 5.0        # spec
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30           # spec
        cost_scaling_factor: 5.0         # spec
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05                   # spec
      track_unknown_space: true
      footprint: "[[0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"   # replaced by the launch file
      footprint_padding: 0.0             # ADR 0003
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: false            # ÄM-01 D-31
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"   # spec
      tolerance: 0.05                    # spec
      allow_unknown: false               # spec
      max_planning_time: 2.0             # spec
      cost_travel_multiplier: 2.0        # spec
      downsample_costmap: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      use_final_approach_orientation: false

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # navigate_wait_replan.xml uses Wait and BackUp (recovery, ADR 0002). Spin and DriveOnHeading are loaded
    # because bt_navigator also loads the default NavigateThroughPoses tree, which needs them (Jazzy).
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5
    simulate_ahead_time: 2.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"                # spec
    max_velocity: [0.20, 0.0, 0.8]       # spec
    min_velocity: [-0.10, 0.0, -0.8]     # spec
    max_accel: [0.30, 0.0, 1.5]          # spec
    max_decel: [-0.50, 0.0, -2.0]        # spec
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_mux_a
    cmd_vel_out_topic: cmd_vel_cm
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"            # spec
      # spec: dynamic footprint from /footprint (footprint_switcher, later); until then the fixed robot footprint
      points: "[[0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"   # replaced by the launch file
      time_before_collision: 1.0         # spec
      simulation_time_step: 0.1
      min_points: 4
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_filtered"            # spec
      enabled: true

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 10.0                   # chosen here: slow simulation on CI
    node_names: ["map_server", "amcl", "controller_server", "planner_server", "behavior_server",
                 "velocity_smoother", "bt_navigator"]

lifecycle_manager_safety:
  ros__parameters:
    autostart: true
    bond_timeout: 10.0
    node_names: ["collision_monitor"]
