name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks that need no ROS installation.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Interface file syntax check
        run: python3 tools/check_interfaces.py ros2_ws/src
      - name: Tool and core logic tests
        run: |
          python3 -m pip install --break-system-packages pytest ruff pyyaml numpy
          python3 -m pytest tools/tests ros2_ws/src/robotros_bridge/test ros2_ws/src/robotros_sim/test ros2_ws/src/robotros_obstacles/test ros2_ws/src/robotros_mission/test ros2_ws/src/robotros_map/test -q
      - name: Ruff
        run: ruff check .
      - name: i18n files (web_ui/i18n)
        run: python3 tools/check_i18n.py
      - name: Web UI unit tests (node --test)
        run: node --test web_ui/test/*.test.mjs
      - name: Protocol vectors are up to date
        run: |
          python3 tools/gen_protocol_vectors.py | diff - firmware/test/vectors/protocol_vectors.json
          python3 tools/gen_protocol_vectors.py --text | diff - firmware/test/vectors/protocol_vectors.txt

  # Firmware core on the host (C++, spez_firmware_protokoll.md 11.1), with sanitizers.
  firmware-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: clang-format --dry-run --Werror firmware/lib/core/* firmware/test/host/*.cpp firmware/test/host/*.h
      - name: Build and run host tests
        run: |
          cmake -S firmware/test/host -B build/fw -DWITH_SANITIZERS=ON
          cmake --build build/fw
          ctest --test-dir build/fw --output-on-failure

  # Authoritative build and test on ROS 2 Jazzy (softwarespezifikation.md section 16).
  ros:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y ros-dev-tools
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros2_ws/src --ignore-src -r -y --rosdistro jazzy
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --event-handlers console_direct+
      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Interface smoke test
        run: tools/smoke_interfaces.sh

  # Headless Gazebo Harmonic smoke test (softwarespezifikation.md section 14): start the generic world,
  # check /scan, /odom, TF, and drive. Software rendering (Mesa) because CI has no GPU.
  sim:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y ros-dev-tools libegl1 libgl1-mesa-dri mesa-utils xvfb xauth python3-pip
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros2_ws/src --ignore-src -r -y --rosdistro jazzy
      - name: Headless browser for the web UI check (Playwright Chromium)
        run: |
          python3 -m pip install --break-system-packages playwright
          python3 -m playwright install --with-deps chromium
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --packages-up-to robotros_sim --event-handlers console_direct+
      - name: Simulation smoke test
        run: tools/sim_smoke.sh build/sim_smoke
      - name: Mapping and navigation in the simulation
        run: tools/sim_nav.sh build/sim_nav
      - name: Interactive start script (RViz under Xvfb)
        run: |
          xvfb-run -a tools/sim_start.sh mapping --check
          WEB_UI_CHECK=1 xvfb-run -a tools/sim_start.sh nav build/sim_nav/generic_map.yaml --check
      - name: Keep simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: |
            build/sim_smoke
            build/sim_nav
            build/sim_start
          if-no-files-found: ignore
