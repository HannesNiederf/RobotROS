name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks that need no ROS installation.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Interface file syntax check
        run: python3 tools/check_interfaces.py ros2_ws/src
      - name: Tool and core logic tests
        run: |
          python3 -m pip install --break-system-packages pytest ruff pyyaml
          python3 -m pytest tools/tests ros2_ws/src/robotros_bridge/test -q
      - name: Ruff
        run: ruff check .
      - name: Protocol vectors are up to date
        run: |
          python3 tools/gen_protocol_vectors.py | diff - firmware/test/vectors/protocol_vectors.json
          python3 tools/gen_protocol_vectors.py --text | diff - firmware/test/vectors/protocol_vectors.txt

  # Firmware core on the host (C++, spez_firmware_protokoll.md 11.1), with sanitizers.
  firmware-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: clang-format --dry-run --Werror firmware/lib/core/* firmware/test/host/*.cpp firmware/test/host/*.h
      - name: Build and run host tests
        run: |
          cmake -S firmware/test/host -B build/fw -DWITH_SANITIZERS=ON
          cmake --build build/fw
          ctest --test-dir build/fw --output-on-failure

  # Authoritative build and test on ROS 2 Jazzy (softwarespezifikation.md section 16).
  ros:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y ros-dev-tools
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros2_ws/src --ignore-src -r -y --rosdistro jazzy
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --event-handlers console_direct+
      - name: Repeat full colcon test (probe, temporary)
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          fails=0
          for i in $(seq 1 12); do
            colcon test --event-handlers console_direct+ > /tmp/ct_$i.log 2>&1
            if colcon test-result > /dev/null 2>&1; then r=PASS; else r=FAIL; fails=$((fails+1)); fi
            echo "run $i $r"
            grep -E "stalled|longest gap|link lost|EVT 5|^E  " /tmp/ct_$i.log | head -12
          done
          echo "FAILS: $fails of 12"
          echo "sequential:"
          for i in $(seq 1 5); do
            colcon test --executor sequential > /tmp/cs_$i.log 2>&1
            if colcon test-result > /dev/null 2>&1; then r=PASS; else r=FAIL; fi
            echo "seq run $i $r"; grep -rhE "stalled|longest gap" build/robotros_bridge/ /tmp/cs_$i.log 2>/dev/null | head -5
          done
      - name: Interface smoke test
        run: tools/smoke_interfaces.sh
