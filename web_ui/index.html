<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>robotROS</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="vendor/roslib.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header>
    <div class="brand">robotROS</div>
    <div id="conn" class="pill" data-state="connecting"></div>
    <div id="safety" class="pill"></div>
    <div id="mission" class="pill"></div>
    <div class="activity">
      <div><span class="label" data-i18n="activity.title"></span> <span id="activity-now"></span></div>
      <div><span class="label" data-i18n="plan.title"></span> <span id="activity-plan"></span></div>
    </div>
    <div id="langs" class="langs"></div>
    <button id="estop" class="estop" data-i18n="ui.estop"></button>
  </header>
  <nav id="tabs">
    <button data-page="map" class="active" data-i18n="tab.map"></button>
    <button data-page="orders" data-i18n="tab.orders"></button>
    <button data-page="stations" data-i18n="tab.stations"></button>
  </nav>
  <div id="alert-bar" class="alert-bar" hidden>
    <div id="alert-text" class="grow"></div>
    <div id="alert-options" class="alert-options"></div>
  </div>
  <main id="page-map">
    <canvas id="map-canvas"></canvas>
    <div class="hint" data-i18n="map.tap_hint"></div>
    <div id="goal-dialog" class="dialog" hidden>
      <div class="dialog-box">
        <div class="dialog-title" data-i18n="map.goal.title"></div>
        <div id="goal-dialog-text"></div>
        <div class="hint-small" data-i18n="map.goal.order_hint"></div>
        <div class="dialog-buttons">
          <button id="goal-cancel" data-i18n="ui.cancel"></button>
          <button id="goal-ok" class="primary" data-i18n="map.goal.go"></button>
        </div>
      </div>
    </div>
    <div id="goal-error" class="error-line"></div>
  </main>
  <main id="page-orders" class="page" hidden>
    <section class="card">
      <div class="card-title" data-i18n="orders.new"></div>
      <div class="form">
        <label><span data-i18n="orders.from"></span> <select id="order-source"></select></label>
        <label><span data-i18n="orders.to"></span> <select id="order-dest"></select></label>
        <label><span data-i18n="orders.priority"></span>
          <select id="order-priority">
            <option value="2">2</option><option value="5" selected>5</option><option value="8">8</option>
          </select>
        </label>
        <button id="order-create" class="primary" data-i18n="orders.create"></button>
      </div>
      <div id="order-result" class="result"></div>
    </section>
    <section class="card grow-card">
      <div class="card-title" data-i18n="orders.list"></div>
      <div id="order-list" class="list"></div>
    </section>
  </main>
  <main id="page-stations" class="page" hidden>
    <section class="card">
      <div class="card-title" data-i18n="stations.teach"></div>
      <div class="hint-small" data-i18n="stations.teach_hint"></div>
      <div class="form">
        <label><span data-i18n="stations.name"></span> <input id="station-name" type="text" maxlength="30"></label>
        <label><span data-i18n="stations.kind"></span>
          <select id="station-kind">
            <option value="STORAGE" data-i18n="stations.kind.STORAGE"></option>
            <option value="DOCK" data-i18n="stations.kind.DOCK"></option>
          </select>
        </label>
        <label class="check"><input id="station-occupied" type="checkbox"> <span data-i18n="stations.occupied"></span></label>
        <button id="station-teach" class="primary" data-i18n="stations.teach_here"></button>
      </div>
      <div id="station-result" class="result"></div>
    </section>
    <section class="card grow-card">
      <div class="card-title" data-i18n="stations.list"></div>
      <div id="station-list" class="list"></div>
    </section>
  </main>
  <div id="ack-dialog" class="dialog modal" hidden>
    <div class="dialog-box">
      <div class="dialog-title" data-i18n="ack.title"></div>
      <div id="ack-text"></div>
      <div id="ack-buttons" class="dialog-buttons"></div>
      <div id="ack-error" class="error-line"></div>
    </div>
  </div>
  <div id="overlay-lost" class="overlay" hidden><div data-i18n="ui.connection.lost_long"></div></div>
</body>
</html>
